# One box: the proxy, the server, the database (backend spec §11.1).
#
#     ./gradlew :backend:installDist
#     cp backend/.env.example backend/.env      # then set the password
#     docker compose -f backend/compose.yaml up --build
#
# Caddy is the only thing listening publicly. With DOMAIN unset it serves https://localhost
# with a certificate of its own making; with a real name it gets one from Let's Encrypt.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/anatomypro
      DATABASE_USER: anatomypro
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      # The client ids a sign-in token must be made out to, comma-separated. Unset: no sign-in.
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      # Caddy is in front, and nothing else can reach this port.
      TRUST_FORWARDED_HEADERS: "true"
      # The daily and the boards are for subscribers: accounts with a purchase a store has
      # vouched for (backend spec §8). "true" lets everyone in regardless, for trying things
      # out; a real server that has it on is giving the product away.
      EVERYONE_IS_SUBSCRIBED: ${EVERYONE_IS_SUBSCRIBED:-false}
      # What is on sale: product ids, the same in both stores, each with monthly or yearly.
      PLANS: ${PLANS:-}
      # Google Play. Unset: no Play purchase is accepted and the Play webhook answers 404.
      GOOGLE_PLAY_PACKAGE: ${GOOGLE_PLAY_PACKAGE:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_PUSH_AUDIENCE: ${GOOGLE_PUSH_AUDIENCE:-}
      GOOGLE_PUSH_SERVICE_ACCOUNT: ${GOOGLE_PUSH_SERVICE_ACCOUNT:-}
      # The App Store. Unset: no App Store purchase is accepted and its webhook answers 404.
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_ROOT_CA_FILE: ${APPLE_ROOT_CA_FILE:-}
      APPLE_ENVIRONMENTS: ${APPLE_ENVIRONMENTS:-}
      APPLE_API_KEY_FILE: ${APPLE_API_KEY_FILE:-}
      APPLE_API_KEY_ID: ${APPLE_API_KEY_ID:-}
      APPLE_API_ISSUER_ID: ${APPLE_API_ISSUER_ID:-}
      RECHECK_EVERY_HOURS: ${RECHECK_EVERY_HOURS:-6}
    volumes:
      # The stores' key files, which the *_FILE values above point into. Never committed.
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # The version the tests run against.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: anatomypro
      POSTGRES_USER: anatomypro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anatomypro -d anatomypro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
