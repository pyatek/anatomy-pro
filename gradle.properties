#Kotlin
kotlin.code.style=official
# iosMain is a shared source set across iosArm64 and iosSimulatorArm64, so its metadata
# compilation needs the anatomyRenderer cinterop commonized across both targets. Without
# this, FilamentAnatomyRenderer compiles per target but fails metadata compilation.
kotlin.mpp.enableCInteropCommonization=true
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true